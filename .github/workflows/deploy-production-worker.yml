name: Deploy Choferes Argentinos production video API

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/worker.js
  workflow_dispatch:
    inputs:
      confirm_worker_deploy:
        description: "Type DEPLOY-WORKER to deploy the production Worker only (no D1 changes)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: choferes-argentinos-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_worker_deploy == 'DEPLOY-WORKER') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply additive production D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 migrations apply choferes-argentinos --remote

      - name: Verify production video metadata and chunk integrity
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: >-
            d1 execute choferes-argentinos --remote --command
            "SELECT
              (SELECT COUNT(*) FROM video_media) AS videos,
              (SELECT COUNT(*) FROM video_chunks) AS chunks,
              (SELECT COUNT(*) FROM video_media vm WHERE
                (SELECT COUNT(*) FROM video_chunks vc WHERE vc.video_id=vm.id)
                != CAST((vm.byte_size + 524287) / 524288 AS INTEGER))
                AS videos_with_incomplete_chunks,
              (SELECT COUNT(*) FROM posts WHERE video_id IS NOT NULL)
                AS posts_with_video;"
            
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: deploy --env=""

      - name: Verify production Worker health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://choferes-argentinos-api.chazoncba.workers.dev/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Production Worker health check failed."
          exit 1
