name: Inspect production D1 schema (read-only)

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Type INSPECT-PRODUCTION to inspect the production database without changing it"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: choferes-argentinos-production-inspection
  cancel-in-progress: false

jobs:
  inspect-production-d1:
    if: ${{ github.ref == 'refs/heads/production-cutover-prep' && inputs.confirm_read_only == 'INSPECT-PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify production database tables
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name;" --json

      - name: Read applied migration history
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT * FROM d1_migrations ORDER BY id;" --json

      - name: Inspect route status columns
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "PRAGMA table_info(route_status);" --json

      - name: Inspect driver activity columns
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "PRAGMA table_info(driver_activity);" --json

      - name: Inspect posts columns
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "PRAGMA table_info(posts);" --json

      - name: Inspect profile columns
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "PRAGMA table_info(profiles);" --json

      - name: Check feature tables
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('push_subscriptions','badge_awards') ORDER BY name;" --json

      - name: Inspect complete table and index definitions
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE type IN ('table','index') AND name NOT LIKE 'sqlite_%' ORDER BY type,name;" --json

      - name: Count profiles records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT COUNT(*) AS row_count FROM profiles;" --json

      - name: Count posts records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT COUNT(*) AS row_count FROM posts;" --json

      - name: Count comments records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT COUNT(*) AS row_count FROM comments;" --json

      - name: Count reactions records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT COUNT(*) AS row_count FROM reactions;" --json

      - name: Count media records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT COUNT(*) AS row_count FROM media;" --json

      - name: Count route_status records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT COUNT(*) AS row_count FROM route_status;" --json

      - name: Count driver_activity records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT COUNT(*) AS row_count FROM driver_activity;" --json

      - name: Count messages records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT COUNT(*) AS row_count FROM messages;" --json

      - name: Inspect route status distribution
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT status,COUNT(*) AS row_count FROM route_status GROUP BY status ORDER BY status;" --json

      - name: Inspect PAD activity distribution
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT kind,status,COUNT(*) AS row_count FROM driver_activity GROUP BY kind,status ORDER BY kind,status;" --json

      - name: Verify foreign key integrity
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "PRAGMA foreign_key_check;" --json
