name: Repair production credentials schema

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/migrations/0014_repair_credentials_schema.sql
      - .github/workflows/repair-production-credentials-schema.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choferes-argentinos-production-db-repair
  cancel-in-progress: false

jobs:
  repair-production-schema:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply credentials schema repair to production D1 only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --file migrations/0014_repair_credentials_schema.sql

      - name: Verify credentials schema on production D1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 execute choferes-argentinos --remote --command "SELECT login_username, password_salt, password_hash, password_iterations FROM profiles LIMIT 0; SELECT name FROM sqlite_master WHERE type='table' AND name='login_attempts';"
