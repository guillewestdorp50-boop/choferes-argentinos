name: Validate password login feature

on:
  push:
    branches:
      - feature/password-login
    paths:
      - "cloudflare/worker.js"
      - "cloudflare/migrations/0013_unique_nicknames_password_login.sql"
      - "index.html"
      - ".github/workflows/validate-password-login.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker and PWA JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">([\\s\\S]*?)</script>', html)
          if not match:
              raise SystemExit("No se encontró el módulo JavaScript de la PWA.")
          Path("/tmp/choferes-pwa.mjs").write_text(match.group(1), encoding="utf-8")
          Path("/tmp/choferes-worker.mjs").write_text(Path("cloudflare/worker.js").read_text(encoding="utf-8"), encoding="utf-8")
          PY
          node --check /tmp/choferes-pwa.mjs
          node --check /tmp/choferes-worker.mjs

      - name: Validate the additive D1 migration and nickname uniqueness
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.execute("CREATE TABLE profiles (id TEXT PRIMARY KEY, nickname TEXT NOT NULL)")
          db.executemany("INSERT INTO profiles(id,nickname) VALUES(?,?)", [
              ("owner", "Westdorf"), ("sole", "Sole"), ("viejo", "El Viejo")
          ])
          db.executescript(Path("cloudflare/migrations/0013_unique_nicknames_password_login.sql").read_text(encoding="utf-8"))
          db.execute("INSERT INTO profiles(id,nickname,nickname_key) VALUES(?,?,?)",
                     ("el-viejo-community", "El Viejo", "el viejo"))
          try:
              db.execute("INSERT INTO profiles(id,nickname,nickname_key) VALUES(?,?,?)",
                         ("duplicate", "WESTDORF", "westdorf"))
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit("La base aceptó un apodo humano duplicado.")
          print("Migración SQL válida; los apodos humanos duplicados se rechazan.")
          PY
