name: Deploy isolated Choferes Argentinos preview Worker

on:
  # Preview only: automatically apply pending migrations and deploy when this branch changes.
  push:
    branches:
      - cloudflare-backend-prep
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Apply preview D1 migrations and deploy preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply preview D1 migrations only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 migrations apply choferes-argentinos-preview --remote --env preview

      - name: Deploy preview Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: deploy --env preview
