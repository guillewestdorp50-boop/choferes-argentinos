name: Manually deploy isolated Choferes Argentinos preview Worker

on:
  # This file exists on the default branch so GitHub exposes Run workflow.
  # The production/main branch is deliberately blocked from deploying anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/cloudflare-backend-prep'
    name: Apply preview D1 migrations and deploy preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply preview D1 migrations only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 migrations apply choferes-argentinos-preview --remote --env preview

      - name: Deploy preview Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: deploy --env preview
