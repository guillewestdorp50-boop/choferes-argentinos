name: Manually deploy isolated Choferes Argentinos preview Worker

on:
  # Deliberately manual: commits on cloudflare-backend-prep must not deploy
  # or alter the preview Worker/D1 until the owner explicitly starts this workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Apply preview D1 migrations and deploy preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply preview D1 migrations only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 migrations apply choferes-argentinos-preview --remote --env preview

      - name: Deploy preview Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: deploy --env preview
