name: Provision isolated Choferes Argentinos preview D1

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-backend-prep
    paths:
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: read

jobs:
  create:
    name: Create preview-only D1 database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create preview D1 database
        id: create_d1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: cloudflare
          command: d1 create choferes-argentinos-preview

      - name: Publish database creation details
        env:
          RESULT: ${{ steps.create_d1.outputs.command-output }}
        run: |
          echo '### Preview D1 database created' >> "$GITHUB_STEP_SUMMARY"
          echo 'This database is separate from the production database.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
