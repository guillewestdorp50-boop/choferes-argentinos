name = "choferes-argentinos-api"
main = "worker.js"
compatibility_date = "2026-11-17"
workers_dev = true
preview_urls = true

[vars]
APP_ORIGIN = "https://choferes-argentinos.onrender.com"
ENVIRONMENT = "production"
VIDEO_STORAGE_LIMIT_BYTES = "850000000"

[[kv_namespaces]]
binding = "VIDEO_KV"
id = "459a6600ecb11d2ff481a87944d93dfb"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "choferes-argentinos"
database_id = "054da478-3bbf-4e05-8615-62e17405d345"
migrations_dir = "migrations"

# Isolated preview environment. It never shares the production D1 database.
[env.preview]
name = "choferes-argentinos-api-preview"
workers_dev = true
preview_urls = true

[env.preview.vars]
APP_ORIGIN = "https://choferes-argentinos-preview.onrender.com"
ENVIRONMENT = "development"
VIDEO_STORAGE_LIMIT_BYTES = "25000000"

[[env.preview.kv_namespaces]]
binding = "VIDEO_KV"
id = "459a6600ecb11d2ff481a87944d93dfb"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "choferes-argentinos-preview"
database_id = "15231f20-2ad4-4bb7-ad39-61bcc83529b8"
migrations_dir = "migrations"
